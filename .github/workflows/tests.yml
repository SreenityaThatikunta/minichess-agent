name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The agent is standard library only, so the span that matters is the
        # oldest and newest interpreters it claims to support.
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      - name: Play a full game end to end
        # Catches breakage in the match runner itself, which the unit tests
        # drive the agent directly and therefore never exercise.
        run: python game_runner.py
